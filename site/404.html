<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perronjoy</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f7">
  <meta name="robots" content="noindex">
  <!-- GitHub Pages serves this file for unknown paths. Paths here must work from any
       folder depth, so the page sends the visitor to the home page of this site. -->
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      // Project site: https://<user>.github.io/<repo>/…  → keep the first segment.
      var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
      location.replace(base);
    })();
  </script>
</head>
<body>
  <p><a href="/">Perronjoy</a></p>
</body>
</html>
