<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perronjoy</title>
  <meta name="description" content="Platform view and transfer route for a Dutch railway station.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f4f7">
  <script src="js/boot.js"></script>
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234fae62'/%3E%3Crect x='11' y='6' width='10' height='20' rx='3' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="./index.html" data-i18n-label="nav.back" aria-label="Terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="title">
      <h1 id="station-name">…</h1>
      <p id="station-sub" data-i18n="app.subtitle">Perronoverzicht en overstap</p>
    </div>
    <nav class="station-nav" id="station-nav" data-i18n-label="nav.stations" aria-label="Stations"></nav>
    <button class="icon-btn theme-switch" type="button" data-i18n-label="nav.theme" aria-label="Thema">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="lang-switch" type="button" data-i18n-label="nav.lang"><span data-lang="nl">NL</span> · <span data-lang="en">EN</span></button>
  </header>

  <main class="layout">
    <section class="map-panel">
      <div class="segmented" id="mode" role="group" data-active="map">
        <button type="button" data-mode="map" aria-pressed="true" data-i18n="mode.map">Kaart</button>
        <button type="button" data-mode="list" aria-pressed="false" data-i18n="mode.list">Lijst</button>
      </div>
      <div class="map-wrap" id="map">
        <div class="fog fog--top"></div>
        <div class="fog fog--bottom"></div>
      </div>
      <div class="list-wrap" id="list" hidden></div>
    </section>

    <aside class="side-panel" id="side">
      <section class="card">
        <h2 data-i18n="transfer.title">Jouw overstap</h2>
        <div class="transfer-row">
          <label for="sel-from" data-i18n="transfer.from">Je komt aan op</label>
          <select id="sel-from"></select>
        </div>
        <div class="transfer-row">
          <label for="sel-to" data-i18n="transfer.to">Je volgende trein</label>
          <select id="sel-to"></select>
        </div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
        <ol class="steps" id="steps"></ol>
      </section>

      <section class="card">
        <h2 data-i18n="dep.title">Vertrek</h2>
        <div class="dep-list" id="dep-list"></div>
        <p class="sample-note" data-i18n="dep.sample">Voorbeelddata. Dit zijn geen actuele tijden.</p>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <p><strong data-i18n="app.name">Perronjoy</strong></p>
    <p data-i18n="footer.unofficial">Perronjoy is geen officiële site van NS, ProRail of een stationsbeheerder.</p>
    <p data-i18n="footer.sample">Alle tijden zijn voorbeelddata.</p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
