<!--
  Perronjoy scene: Utrecht Centraal. Contract: docs/SPEC.md section 5.
  Rotated so that platform numbers run left to right: the top of the scene is the
  south-south-east end ('s-Hertogenbosch, Arnhem), the bottom the north-north-west end
  (Amsterdam, Gouda, Zwolle). Left is the city side (Hoog Catharijne), right the
  Jaarbeurs side. 1 unit = 1 metre along the tracks; across the tracks the station is
  widened about x2.6, the surroundings are compressed. Sources: NOTES.md.
-->
