<!--
  Perronjoy scene: Schiphol Airport (id schiphol-airport). Rules: docs/SPEC.md section 5.
  Sources and scale: NOTES.md in this folder.

  - 1 unit = 1 metre along the tracks; y = metres along the tracks + 300,
    from the south-west end (top: Hoofddorp, Leiden, HSL) to the north-east end
    (bottom: Amsterdam). Tracks run from the top to the bottom.
  - Across the tracks the station is widened x2.8 (track 1 at x 0, track 6 at x 158);
    the surroundings beyond the outer tracks are compressed x0.6.
  - The platforms lie underground. The surroundings are what lies above and
    around them; Schiphol Plaza is drawn as a hall above the platforms.
  - Written by a small script from an OpenStreetMap download; edit by hand and
    keep the node circles in step with station.json.
-->
