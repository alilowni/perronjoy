<?xml version="1.0" encoding="UTF-8"?>
<!--
  Perronjoy scene: Rotterdam Centraal. Contract: docs/SPEC.md section 5.
  Rotated so that platform numbers run left to right: the top of the scene is the
  west-south-west end (Schiedam, Delft, Den Haag), the bottom the east-north-east end
  (Gouda and Utrecht, the HSL, the Willemsspoortunnel to Dordrecht and Breda). Left is the
  city side (station hall, Stationsplein, Weena), right the Proveniersplein side.
  1 unit = 1 metre along the tracks; across the tracks the station is widened about x2.6,
  the surroundings are compressed. Sources and VERIFY items: NOTES.md.
-->
